name: Publikacja na GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Numer wersji (wymusza świeże pliki po każdej publikacji)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g; s/id=\"ver\">dev</id=\"ver\">${GITHUB_SHA::7}</" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
